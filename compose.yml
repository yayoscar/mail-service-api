services:
  postgres:
    image: postgres:16
    container_name: mail_service_postgres
    environment:
      POSTGRES_USER: mail_user
      POSTGRES_PASSWORD: mail_password
      POSTGRES_DB: mail_service
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mail_service_redis
    ports:
      - "6380:6379"

volumes:
  postgres_data:
