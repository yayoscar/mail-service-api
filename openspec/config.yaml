schema: spec-driven

context: |
  Dominio: gateway centralizado de envío de correos institucionales (DGETI). Cada sistema
  consumidor se autentica con su API key y solo puede enviar desde buzones Microsoft 365
  autorizados para él. No recibe correo, no gestiona plantillas, no tiene frontend.
  Stack: NestJS 11 (TypeScript strict), PostgreSQL 16 + Prisma 7 (adapter pg, cliente en
  generated/prisma), Redis 7 + BullMQ (cola email-send), Multer (multipart, disco temporal),
  Swagger en /docs, class-validator/class-transformer.
  Integración Microsoft Graph: permisos DELEGADOS (Mail.Send + offline_access) por buzón,
  flujo OAuth2 Authorization Code multi-tenant (endpoint /common), envío vía /me/sendMail.
  El PRD original de Clavix habla de Client Credentials; está obsoleto en ese punto.
  Convenciones: mensajes de API y logs en español; respuestas envueltas en
  { success, data }; errores { statusCode, message, timestamp, path }; endpoints admin con
  x-admin-api-key, envío con x-api-key; contenedores con Podman Compose (nunca Docker).
  Producción: el servicio corre como daemon de systemd (no PM2) y ya tiene su .env;
  los cambios de despliegue se documentan en docs/ACTUALIZACION-PRODUCCION.md.
  Specs en español usando las palabras clave SHALL/MUST.

